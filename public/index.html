<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DevOps Portal | Secure Login & Authentication</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="background-decor">
    <div class="circle circle-1"></div>
    <div class="circle circle-2"></div>
  </div>

  <div class="container">
    <!-- Header -->
    <header class="app-header">
      <div class="badge"><i class="fa-solid fa-cloud-arrow-up"></i> AWS DevOps Demo</div>
      <h1 id="header-title">Welcome Back</h1>
      <p id="header-subtitle">Sign in to access your secure DevOps dashboard</p>
    </header>

    <!-- Alert Box for feedback -->
    <div id="alert-box" class="alert hidden">
      <i id="alert-icon" class="fa-solid"></i>
      <span id="alert-message"></span>
    </div>

    <!-- Auth Forms Card -->
    <div id="auth-card" class="card">
      <!-- Tabs -->
      <div class="tab-switcher">
        <button id="tab-login" class="tab-btn active" onclick="switchTab('login')">
          <i class="fa-solid fa-right-to-bracket"></i> Login
        </button>
        <button id="tab-register" class="tab-btn" onclick="switchTab('register')">
          <i class="fa-solid fa-user-plus"></i> Register
        </button>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-email"><i class="fa-solid fa-envelope"></i> Email Address</label>
          <input type="email" id="login-email" placeholder="devops@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="login-password"><i class="fa-solid fa-lock"></i> Password</label>
          <div class="input-wrapper">
            <input type="password" id="login-password" placeholder="••••••••" required autocomplete="current-password">
            <button type="button" class="toggle-pwd" onclick="togglePassword('login-password', this)">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="login-btn">
          <span>Sign In</span>
          <i class="fa-solid fa-arrow-right"></i>
        </button>
      </form>

      <!-- Register Form -->
      <form id="register-form" class="auth-form hidden" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="reg-username"><i class="fa-solid fa-user"></i> Full Name / Username</label>
          <input type="text" id="reg-username" placeholder="DevOps Engineer" required autocomplete="name">
        </div>

        <div class="form-group">
          <label for="reg-email"><i class="fa-solid fa-envelope"></i> Email Address</label>
          <input type="email" id="reg-email" placeholder="devops@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label for="reg-password"><i class="fa-solid fa-lock"></i> Password</label>
          <div class="input-wrapper">
            <input type="password" id="reg-password" placeholder="Min 6 characters" required autocomplete="new-password" minlength="6">
            <button type="button" class="toggle-pwd" onclick="togglePassword('reg-password', this)">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="submit-btn" id="register-btn">
          <span>Create Account</span>
          <i class="fa-solid fa-user-check"></i>
        </button>
      </form>
    </div>

    <!-- Dashboard / Logged In Card -->
    <div id="dashboard-card" class="card hidden">
      <div class="user-avatar">
        <i class="fa-solid fa-user-shield"></i>
      </div>
      <h2 id="user-display-name">DevOps User</h2>
      <p id="user-display-email" class="user-email-tag">user@example.com</p>

      <div class="status-box">
        <div class="status-item">
          <span class="status-label">Authentication:</span>
          <span class="status-value success"><i class="fa-solid fa-circle-check"></i> JWT Verified</span>
        </div>
        <div class="status-item">
          <span class="status-label">Database:</span>
          <span class="status-value success"><i class="fa-solid fa-database"></i> SQLite Active</span>
        </div>
        <div class="status-item">
          <span class="status-label">Server Health:</span>
          <span id="health-status" class="status-value info"><i class="fa-solid fa-spinner fa-spin"></i> Checking...</span>
        </div>
      </div>

      <button class="logout-btn" onclick="handleLogout()">
        <i class="fa-solid fa-right-from-bracket"></i> Sign Out
      </button>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
      <p><i class="fa-solid fa-server"></i> Powered by Express.js & SQLite | Ready for AWS Deployment</p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
