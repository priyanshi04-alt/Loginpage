name: CI/CD Pipeline - AWS EC2 Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # Job 1: Build & Verify
  build-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Code
        run: node -e "console.log('✅ Code validation passed!')"

  # Job 2: Deploy to AWS EC2
  deploy-to-aws:
    name: Deploy to AWS EC2
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Add EC2 Host to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Application over SSH
        run: |
          ssh ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e

            echo "🚀 Starting deployment..."

            # Clone repository first time or pull latest
            if [ ! -d "$HOME/app/.git" ]; then
              rm -rf "$HOME/app"
              git clone https://github.com/priyanshi04-alt/Loginpage.git "$HOME/app"
            else
              cd "$HOME/app"
              git fetch origin
              git reset --hard origin/main
            fi

            cd "$HOME/app"

            echo "📦 Building and starting Docker container..."
            docker compose down || true
            docker compose up -d --build

            echo "📊 Container status:"
            docker compose ps

            echo "✅ Deployment completed successfully!"
          EOF